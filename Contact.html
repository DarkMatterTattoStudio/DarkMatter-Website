<!DOCTYPE HTML>
<html>
<head>
    <title>DarkMatter Tattoo Studio - Contact</title>

<body class="is-preload">

<div id="wrapper">

<section id="contact">

<header>
    
    <h2>Контакт с нас</h2>
</header>


<div class="content">

<p>
Ако искате да се свържем с вас, моля оставете вашите данни и описание на желания от вас проект.
</p>


<form id="contact-form">

<div class="fields">

<div class="field half">
<input type="text" name="name" placeholder="Име" required>
</div>


<div class="field half">
<input type="email" name="email" placeholder="Имейл" required>
</div>


<div class="field">
<textarea name="message" placeholder="Съобщение" rows="7" required></textarea>
</div>


</div>


<ul class="actions">
<li>
<input type="submit" value="Изпрати Съобщение" class="button primary">
</li>
</ul>


<div id="form-message"></div>


</form>


<script>
							const form = document.getElementById("contact-form");
							const message = document.getElementById("form-message");
							form.addEventListener("submit", async function(e) { e.preventDefault();
    						const formData = new FormData(form);
							const response = await fetch("https://formspree.io/f/mbdngkry", {method: "POST",body: formData,headers: {"Accept": "application/json"}});

   							 if (response.ok) {
       							 message.innerHTML = "✅ Вашето съобщение е изпратено успешно! Ще се свържем с вас скоро.";
       							 message.style.display = "block";
        						form.reset();
    						} else {
     						   message.innerHTML = "❌ Възникна грешка. Моля опитайте отново.";
       						 message.style.display = "block";
    						}
							});
						</script>


</div>
